name: Update Flash PCE

on:
  schedule:
    # Weekdays. CPI/PPI/PCE come out at 8:30am New York time (12:30 or 13:30 UTC depending on DST).
    # Three tries cover GitHub's start delays and the odd slow API. On non-release days the job
    # checks FRED's release calendar and stops in seconds.
    - cron: '50 12 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if today is not a release day'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: flash-pce
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nowcast
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node scripts/run.mjs
      - name: Publish if changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "flash-pce-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Update Flash PCE estimate"
            git push
          else
            echo "Nothing changed."
          fi
