name: Update Flash PCE

on:
  schedule:
    # Weekdays. CPI/PPI/PCE come out at 8:30am New York time (12:30 or 13:30 UTC depending on DST).
    # Three tries cover GitHub's start delays and the odd slow API. On non-release days the job
    # checks FRED's release calendar and stops in seconds.
    - cron: '50 12 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if today is not a release day'
        type: boolean
        default: true
      morning:
        description: 'PCE-morning email only (sends just on PCE release days)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flash-pce
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PCE-morning check
        id: morning
        if: github.event_name == 'workflow_dispatch' && inputs.morning
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/morning.mjs
      - name: PCE-morning email
        if: steps.morning.outputs.send == 'true'
        env:
          SENDER: ${{ secrets.SENDER }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python3 scripts/send_email.py --morning
      - name: Run nowcast
        id: run
        if: "!(github.event_name == 'workflow_dispatch' && inputs.morning)"
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node scripts/run.mjs
      - name: Publish if changed
        id: publish
        if: steps.run.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "flash-pce-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Update Flash PCE estimate"
            git pull --rebase -q origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed."
          fi
      - name: Email the update
        if: steps.publish.outputs.changed == 'true' && steps.run.outputs.email == 'true'
        env:
          SENDER: ${{ secrets.SENDER }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python3 scripts/send_email.py
